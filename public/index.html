<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DIGITAL SELLER — Admin</title>
  <meta name="description" content="Painel de administração para cadastro, edição, exclusão e monetização de vídeos — Neon + Node" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: { 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 flex flex-col font-sans antialiased">
  <div id="toast-root"></div>
  <div id="app"></div>

  <!-- Video form modal -->
  <div id="video-modal" class="modal-overlay" hidden>
    <div class="modal-box max-w-2xl">
      <div class="modal-header">
        <h3 id="video-modal-title">Cadastrar Vídeo</h3>
        <button type="button" class="close-btn" data-close="video-modal">✕</button>
      </div>
      <form id="video-form" class="modal-body space-y-4">
        <div>
          <label class="label">Título *</label>
          <input name="title" required class="input" placeholder="Título do vídeo" />
        </div>
        <div>
          <label class="label">Descrição</label>
          <textarea name="description" rows="3" class="input" placeholder="Descrição"></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="label">Preço (US$) *</label>
            <select name="price" required class="input" id="price-select"></select>
          </div>
          <div>
            <label class="label">Duração</label>
            <input name="duration" class="input" placeholder="ex: 10 min" value="10 min" />
          </div>
        </div>
        <div>
          <label class="label">Categoria</label>
          <input name="category" class="input" placeholder="Coleções" value="Coleções" />
        </div>
        <div>
          <label class="label">URL do Vídeo *</label>
          <input name="video_url" required class="input" placeholder="https://... ou link do arquivo" />
        </div>
        <div>
          <label class="label">URL da Thumbnail</label>
          <input name="thumbnail_url" class="input" placeholder="https://... ou data:image..." />
          <p class="text-xs text-gray-500 mt-1">Cole uma URL ou use upload de imagem abaixo (vira base64).</p>
          <input type="file" id="thumb-file" accept="image/*" class="mt-2 text-xs" />
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="is_published" id="is_published" checked class="rounded border-gray-300" />
          <label for="is_published" class="text-sm font-medium">Publicado (visível na loja)</label>
        </div>
        <div id="payment-preview" class="text-xs text-gray-600 bg-gray-50 border rounded-lg p-3"></div>
        <div class="flex flex-col-reverse sm:flex-row justify-end gap-2 pt-2">
          <button type="button" class="btn-outline" data-close="video-modal">Cancelar</button>
          <button type="submit" class="btn-primary" id="video-submit-btn">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Telegram modal -->
  <div id="telegram-modal" class="modal-overlay" hidden>
    <div class="modal-box max-w-md">
      <div class="modal-header">
        <h3>Grupo Telegram</h3>
        <button type="button" class="close-btn" data-close="telegram-modal">✕</button>
      </div>
      <form id="telegram-form" class="modal-body space-y-4">
        <p class="text-sm text-gray-600">Link do grupo/canal usado na loja para entrega após pagamento.</p>
        <div>
          <label class="label">URL do Telegram</label>
          <input name="telegram_url" id="telegram-input" class="input" placeholder="https://t.me/..." />
        </div>
        <div class="flex flex-col-reverse sm:flex-row justify-end gap-2">
          <button type="button" class="btn-outline" data-close="telegram-modal">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar no Neon</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirm -->
  <div id="delete-modal" class="modal-overlay" hidden>
    <div class="modal-box max-w-md">
      <div class="modal-header">
        <h3>Apagar vídeo</h3>
        <button type="button" class="close-btn" data-close="delete-modal">✕</button>
      </div>
      <div class="modal-body space-y-4">
        <p class="text-sm text-gray-700">Tem certeza que deseja apagar <strong id="delete-title"></strong>? Esta ação não pode ser desfeita.</p>
        <div class="flex flex-col-reverse sm:flex-row justify-end gap-2">
          <button type="button" class="btn-outline" data-close="delete-modal">Cancelar</button>
          <button type="button" class="btn-danger" id="delete-confirm-btn">Apagar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Player modal -->
  <div id="player-modal" class="modal-overlay" hidden>
    <div class="modal-box max-w-3xl">
      <div class="modal-header">
        <h3 id="player-title">Preview</h3>
        <button type="button" class="close-btn" data-close="player-modal">✕</button>
      </div>
      <div class="modal-body">
        <video id="player-video" controls playsinline class="w-full rounded-xl bg-black max-h-[70vh]"></video>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
